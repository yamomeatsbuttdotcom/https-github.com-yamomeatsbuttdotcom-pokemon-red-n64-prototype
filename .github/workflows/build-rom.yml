name: Build N64 ROM

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ROM with libdragon Docker SDK
        run: |
          docker run --rm \
            -v "$PWD:/game" \
            -w /game \
            ghcr.io/dragonminded/libdragon:latest \
            sh -ec 'git clone --depth 1 --branch trunk https://github.com/DragonMinded/libdragon.git /tmp/libdragon && cd /tmp/libdragon && ./build.sh && cd /game && make'

      - name: Verify ROM exists
        run: |
          test -s pallet_mt_moon.z64
          file pallet_mt_moon.z64
          ls -lh pallet_mt_moon.z64

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pallet-mt-moon-rom
          path: pallet_mt_moon.z64
          if-no-files-found: error
