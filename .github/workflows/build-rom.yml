name: Build N64 ROM

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Checkout libdragon
        uses: actions/checkout@v4
        with:
          repository: DragonMinded/libdragon
          ref: trunk
          path: libdragon-sdk

      - name: Build libdragon toolchain image from source
        run: docker build -t local-libdragon-toolchain ./libdragon-sdk

      - name: Build libdragon SDK and game ROM
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/libdragon-sdk \
            local-libdragon-toolchain \
            sh -ec './build.sh && cd /workspace && make'

      - name: Verify ROM exists
        run: |
          test -s pallet_mt_moon.z64
          file pallet_mt_moon.z64
          ls -lh pallet_mt_moon.z64

      - name: Validate N64 ROM structure
        run: python3 tools/check_rom.py pallet_mt_moon.z64

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pallet-mt-moon-rom
          path: pallet_mt_moon.z64
          if-no-files-found: error
