name: Build N64 ROM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install libdragon SDK
        run: |
          git clone --depth 1 --branch trunk https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          ./build.sh

      - name: Compile ROM
        run: make

      - name: Verify ROM exists
        run: |
          test -s pallet_mt_moon.z64
          file pallet_mt_moon.z64
          ls -lh pallet_mt_moon.z64

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pallet-mt-moon-rom
          path: pallet_mt_moon.z64
          if-no-files-found: error
