name: Build N64 ROM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Run host gameplay regression tests
        run: sh tools/run_logic_tests.sh

      - name: Checkout libdragon
        uses: actions/checkout@v4
        with:
          repository: DragonMinded/libdragon
          ref: trunk
          path: libdragon-sdk

      - name: Cache libdragon Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: libdragon-buildx-${{ runner.os }}-v1
          restore-keys: |
            libdragon-buildx-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build libdragon toolchain image from source
        uses: docker/build-push-action@v6
        with:
          context: ./libdragon-sdk
          load: true
          tags: local-libdragon-toolchain:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate Docker build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build libdragon SDK and game ROM
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/libdragon-sdk \
            local-libdragon-toolchain \
            sh -ec './build.sh && cd /workspace && make'

      - name: Build minimal boot probe ROM
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            local-libdragon-toolchain \
            sh -ec 'make BOOT_PROBE=1 ROMNAME=boot_probe BUILD_DIR=build_probe'

      - name: Verify ROM exists
        run: |
          test -s pallet_mt_moon.z64
          file pallet_mt_moon.z64
          ls -lh pallet_mt_moon.z64 boot_probe.z64

      - name: Validate N64 ROM structure
        run: |
          python3 tools/check_rom.py pallet_mt_moon.z64
          python3 tools/check_rom.py boot_probe.z64

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pallet-mt-moon-rom
          path: |
            pallet_mt_moon.z64
            boot_probe.z64
          if-no-files-found: error
